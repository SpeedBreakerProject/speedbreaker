name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      # 1. Setup XenonRecomp Dependencies (e.g. .NET / Dotnet if XenonRecomp requires it)
      - name: Setup .NET SDK (Required for XenonRecomp)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # 2. Build or download XenonRecomp tools on the fly
      - name: Fetch and Build XenonRecomp
        shell: bash
        run: |
          git clone https://github.com/hedge-dev/XenonRecomp.git temp-xenonrecomp
          dotnet publish temp-xenonrecomp -c Release -o build-xenonrecomp

      # 3. Securely acquire your game binary (default.xex)
      # NOTE: You must provide a secure direct link or GitHub Secret/Artifact download 
      # containing your legally dumped default.xex / game assets.
      - name: Download Game Binary
        shell: powershell
        run: |
          # Example: If you host your encrypted/private default.xex somewhere secure:
          # Invoke-WebRequest -Uri "${{ secrets.GAME_BINARY_URL }}" -OutFile "default.xex"
          
          Write-Host "Place your default.xex download logic or secret retrieval here."

      # 4. Run XenonRecomp to generate source files into ppc/
      - name: Run XenonRecomp
        shell: bash
        run: |
          # Run XenonRecomp pointing to your game executable and outputting to ppc/
          # dotnet build-xenonrecomp/XenonRecomp.dll <config.toml> <ppc_context.h> <output_dir>
          echo "Running XenonRecomp..."

      - name: Setup MSVC & Ninja Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Remove Conflicting Unix Link Command
        shell: bash
        run: |
          rm -f /usr/bin/link

      - name: Install Ninja
        run: choco install ninja -y

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          version: v0.8.1

      - name: Configure Environment for SCCache
        shell: bash
        run: |
          echo "CC=sccache cl" >> $GITHUB_ENV
          echo "CXX=sccache cl" >> $GITHUB_ENV

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build with Ninja
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p output
          find build -name "*.exe" -exec cp {} output/ \;
          find build -name "*.dll" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
