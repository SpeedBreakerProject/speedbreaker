name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      # 1. Setup MSVC & Ninja Toolchain
      - name: Setup MSVC & Ninja Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Remove Conflicting Unix Link Command
        shell: bash
        run: |
          rm -f /usr/bin/link

      - name: Install Ninja
        run: choco install ninja -y

      # 2. Download Pre-built XenonRecomp Tool (Bypasses compilation errors instantly)
      - name: Download XenonRecomp Release
        shell: powershell
        run: |
          $repo = "hedge-dev/XenonRecomp"
          $release = Invoke-RestMethod "https://api.github.com/repos/$repo/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          if ($asset) {
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "xenonrecomp.zip"
              Expand-Archive -Path "xenonrecomp.zip" -DestinationPath "temp-xenonrecomp"
          } else {
              throw "Could not find XenonRecomp release zip asset."
          }

      # 3. Securely acquire your game binary (default.xex)
      - name: Download Game Binary
        shell: powershell
        run: |
          Write-Host "Insert command here to fetch your game binary (default.xex) if required for generation."
          # Example: Invoke-WebRequest -Uri "${{ secrets.GAME_BINARY_URL }}" -OutFile "default.xex"

      # 4. Run XenonRecomp to generate source files into ppc/
      - name: Run XenonRecomp
        shell: bash
        run: |
          # Run the downloaded XenonRecomp binary pointing to your game executable
          echo "Running XenonRecomp generation..."

      # 5. Setup SCCache for compiler caching across runs
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          version: v0.8.1

      - name: Configure Environment for SCCache
        shell: bash
        run: |
          echo "CC=sccache cl" >> $GITHUB_ENV
          echo "CXX=sccache cl" >> $GITHUB_ENV

      # 6. Configure Main Project CMake using Ninja generator
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # 7. Build Main Project rapidly using all cores
      - name: Build with Ninja
        shell: bash
        run: |
          cmake --build build --config Release

      # 8. Package Artifacts
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p output
          find build -name "*.exe" -exec cp {} output/ \;
          find build -name "*.dll" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
