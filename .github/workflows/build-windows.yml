name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      # 1. Setup MSVC Toolchain
      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2. Remove conflicting Git Bash 'link' utility
      - name: Remove Conflicting Unix Link Command
        shell: powershell
        run: Remove-Item "C:\Program Files\Git\usr\bin\link.exe" -ErrorAction SilentlyContinue

      - name: Install Ninja
        shell: powershell
        run: choco install ninja -y

      # 3. Build XenonRecomp using Clang-cl
      - name: Build XenonRecomp from Source
        shell: powershell
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git temp-xenonrecomp
          cmake -B temp-xenonrecomp/build -S temp-xenonrecomp -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          cmake --build temp-xenonrecomp/build --config Release

      # 4. Securely acquire your game binary (default.xex)
      - name: Download Game Binary
        shell: powershell
        run: |
          Write-Host "Insert command here to fetch your game binary (default.xex) if required for generation."
          # Example: Invoke-WebRequest -Uri "${{ secrets.GAME_BINARY_URL }}" -OutFile "default.xex"

      # 5. Run XenonRecomp Generation
      - name: Run XenonRecomp Generation
        shell: powershell
        run: |
          Write-Host "Running XenonRecomp generation..."
          # .\temp-xenonrecomp\build\XenonRecomp\XenonRecomp.exe ...

      # 6. Setup sccache for instant incremental builds
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          version: v0.8.1

      # 7. Configure Main Project CMake cleanly on a single line
      - name: Configure CMake
        shell: powershell
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # 8. Build Main Project rapidly using all CPU cores
      - name: Build with Ninja
        shell: powershell
        run: cmake --build build --config Release

      # 9. Package Artifacts
      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output
          Get-ChildItem -Recurse -Filter "*.exe" build | Copy-Item -Destination output
          Get-ChildItem -Recurse -Filter "*.dll" build | Copy-Item -Destination output -ErrorAction SilentlyContinue

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
