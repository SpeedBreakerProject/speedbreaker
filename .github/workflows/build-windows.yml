name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      # 1. Build XenonRecomp using clang-cl (required for its GCC builtins)
      - name: Build XenonRecomp
        shell: powershell
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git temp-xenonrecomp
          cmake -B temp-xenonrecomp/build -S temp-xenonrecomp -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release
          cmake --build temp-xenonrecomp/build --config Release

      # 2. Download default.xex using robust curl with redirect tracking
      - name: Download Game Binary
        shell: powershell
        run: |
          curl.exe -L -o default.xex "https://github.com/rafidwayne/speedbreaker-private/releases/download/xex/default.xex"
          Write-Host "Successfully downloaded default.xex."

      # 3. Run XenonRecomp dynamically to populate ppc/
      - name: Generate PPC Sources via XenonRecomp
        shell: powershell
        run: |
          $recompExe = (Get-ChildItem -Recurse -Filter "XenonRecomp.exe" -Path temp-xenonrecomp).FullName
          Write-Host "Found XenonRecomp at: $recompExe"
          & $recompExe default.xex

      # 4. Configure Main Project CMake using auto-detected default Visual Studio generator
      - name: Configure CMake
        shell: powershell
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      # 5. Build Project rapidly using all CPU cores in parallel
      - name: Build with Visual Studio
        shell: powershell
        run: cmake --build build --config Release --parallel

      # 6. Package Artifacts
      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output
          Get-ChildItem -Recurse -Filter "*.exe" build | Copy-Item -Destination output
          Get-ChildItem -Recurse -Filter "*.dll" build | Copy-Item -Destination output -ErrorAction SilentlyContinue

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
