name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - name: Install Ninja
        shell: powershell
        run: choco install ninja -y

      # 1. Build XenonRecomp using Ninja + clang-cl
      - name: Build XenonRecomp with Clang & Ninja
        shell: powershell
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git temp-xenonrecomp
          
          $llvmPath = "C:\Program Files\LLVM\bin"
          if (!(Test-Path $llvmPath)) {
              $llvmPath = "C:\Program Files (x86)\LLVM\bin"
          }
          echo "$llvmPath" >> $env:GITHUB_PATH
          
          cmake -B temp-xenonrecomp/build -S temp-xenonrecomp -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build temp-xenonrecomp/build --config Release

      # 2. Download default.xex into game/files/ where config/nfsmw.toml expects it
      - name: Download Game Binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "game/files"
          curl.exe -L -o "game/files/default.xex" "https://github.com/rafidwayne/speedbreaker-private/releases/download/xex/default.xex"
          Write-Host "Successfully downloaded default.xex into game/files/."

      # 3. Run XenonRecomp from repository root
      - name: Generate PPC Sources via XenonRecomp
        shell: powershell
        run: |
          $recompExe = (Get-ChildItem -Recurse -Filter "XenonRecomp.exe" -Path temp-xenonrecomp).FullName
          $contextHeader = (Get-ChildItem -Recurse -Filter "ppc_context.h" -Path temp-xenonrecomp).FullName
          
          Write-Host "Found XenonRecomp at: $recompExe"
          Write-Host "Found PPC Context Header at: $contextHeader"
          
          New-Item -ItemType Directory -Force -Path ppc
          
          & $recompExe config/nfsmw.toml "$contextHeader"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "XenonRecomp failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          
          Write-Host "Contents of ppc directory after generation:"
          Get-ChildItem ppc

      # 4. Restore vcpkg Cache (Restores instantly if cache exists)
      - name: Restore vcpkg Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-windows-cache-v4

      # 5. Install Dependencies via vcpkg (Restores from cache in seconds if hit)
      - name: Install Dependencies
        shell: powershell
        run: |
          vcpkg install sdl3:x64-windows `
                        vulkan-headers:x64-windows `
                        vulkan-loader:x64-windows `
                        glslang:x64-windows `
                        spirv-tools:x64-windows `
                        spirv-headers:x64-windows `
                        zlib:x64-windows `
                        ffmpeg:x64-windows

      # 6. Save vcpkg Cache immediately (GUARANTEED to save even if later steps fail!)
      - name: Save vcpkg Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-windows-cache-v4

      # 7. Patch runtime/CMakeLists.txt to accept standard Windows FFmpeg library names
      - name: Patch CMake for Windows FFmpeg
        shell: powershell
        run: |
          $cmakePath = "runtime/CMakeLists.txt"
          if (Test-Path $cmakePath) {
              $content = Get-Content $cmakePath -Raw
              # Replace strict .a static expectations with standard library resolution
              $content = $content -replace 'libavcodec\.a', 'avcodec'
              $content = $content -replace 'libavformat\.a', 'avformat'
              $content = $content -replace 'libavutil\.a', 'avutil'
              $content = $content -replace 'libswscale\.a', 'swscale'
              $content = $content -replace 'libswresample\.a', 'swresample'
              Set-Content $cmakePath $content
              Write-Host "Successfully patched runtime/CMakeLists.txt for Windows library names."
          }

      # 8. Configure Main Project CMake with vcpkg toolchain integration
      - name: Configure Main CMake Project
        shell: powershell
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # 9. Build Main Project rapidly in parallel using all CPU cores
      - name: Build Main Project with Visual Studio
        shell: powershell
        run: cmake --build build --config Release --parallel

      # 10. Package Artifacts
      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output
          Get-ChildItem -Recurse -Filter "*.exe" build | Copy-Item -Destination output
          Get-ChildItem -Recurse -Filter "*.dll" build | Copy-Item -Destination output -ErrorAction SilentlyContinue

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
