name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - name: Install Ninja
        shell: powershell
        run: choco install ninja -y

      # 1. Clone XenonRecomp directly into tools/XenonRecomp and build with Ninja + clang-cl
      - name: Build XenonRecomp with Clang & Ninja
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "tools"
          if (!(Test-Path "tools/XenonRecomp")) {
              git clone --recursive https://github.com/hedge-dev/XenonRecomp.git tools/XenonRecomp
          }
          
          $llvmPath = "C:\Program Files\LLVM\bin"
          if (!(Test-Path $llvmPath)) {
              $llvmPath = "C:\Program Files (x86)\LLVM\bin"
          }
          echo "$llvmPath" >> $env:GITHUB_PATH
          
          cmake -B tools/XenonRecomp/build -S tools/XenonRecomp -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build tools/XenonRecomp/build --config Release

      # 2. Download default.xex into game/files/ where config/nfsmw.toml expects it
      - name: Download Game Binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "game/files"
          curl.exe --fail --show-error --location --retry 3 --retry-all-errors `
            -o "game/files/default.xex" `
            "https://github.com/rafidwayne/speedbreaker-private/releases/download/xex/default.xex"
          if ($LASTEXITCODE -ne 0) { throw "Download of default.xex failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "game/files/default.xex") -or (Get-Item "game/files/default.xex").Length -eq 0) {
              throw "default.xex is missing or empty after download."
          }
          Write-Host "Successfully downloaded default.xex into game/files/."

      # 3. Run XenonRecomp from tools/XenonRecomp
      - name: Generate PPC Sources via XenonRecomp
        shell: powershell
        run: |
          $recompExe = (Get-ChildItem -Recurse -Filter "XenonRecomp.exe" -Path tools/XenonRecomp).FullName
          $contextHeader = (Get-ChildItem -Recurse -Filter "ppc_context.h" -Path tools/XenonRecomp).FullName
          
          Write-Host "Found XenonRecomp at: $recompExe"
          Write-Host "Found PPC Context Header at: $contextHeader"
          
          New-Item -ItemType Directory -Force -Path ppc
          
          & $recompExe config/nfsmw.toml "$contextHeader"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "XenonRecomp failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          
          Write-Host "Contents of ppc directory after generation:"
          Get-ChildItem ppc

      - name: Check vcpkg cache directories
        shell: powershell
        run: |
          Write-Host "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          if (Test-Path "C:\vcpkg\installed") {
              Write-Host "Existing installed tree found."
          } else {
              Write-Host "No installed cache directory exists before restore."
          }
          if (Test-Path "C:\vcpkg\packages") {
              Write-Host "Existing packages tree found."
          } else {
              Write-Host "No packages cache directory exists before restore."
          }

      # 4. Restore vcpkg Cache (stalled segment downloads time out after 5 minutes)
      - name: Restore vcpkg Cache
        uses: actions/cache/restore@v4
        # A cache restore failure must not prevent vcpkg from installing dependencies.
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-windows-cache-v5
          restore-keys: |
            vcpkg-windows-cache-v4

      # 5. Install Dependencies via vcpkg
      - name: Install Dependencies
        shell: powershell
        run: |
          vcpkg install sdl3:x64-windows `
                        vulkan-headers:x64-windows `
                        vulkan-loader:x64-windows `
                        glslang:x64-windows `
                        spirv-tools:x64-windows `
                        spirv-headers:x64-windows `
                        zlib:x64-windows `
                        ffmpeg:x64-windows

      # 6. Save vcpkg Cache immediately
      - name: Save vcpkg Cache
        uses: actions/cache/save@v4
        if: success()
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-windows-cache-v5

      # 7. Setup Windows Compatibility Layer & POSIX Stubs (pthread.h & unistd.h)
      - name: Patch Windows Compatibility & POSIX Stubs
        shell: powershell
        run: |
          $winCompatPath = "runtime/compat/win/win_compat.h"
          if (Test-Path $winCompatPath) {
              $content = Get-Content $winCompatPath -Raw
              $content = $content -replace '#include <unistd.h>', "// #include <unistd.h>"
              $content = $content -replace '#include <pthread.h>', "// #include <pthread.h>"
              
              $prefix = @"
          #ifndef WIN_COMPAT_H_INJECTED
          #define WIN_COMPAT_H_INJECTED
          #include <winsock2.h>
          #include <windows.h>
          #include <stdint.h>
          #ifndef _SSIZE_T_DEFINED
          #define _SSIZE_T_DEFINED
          typedef intptr_t ssize_t;
          #endif
          #endif

          "@
              $content = $prefix + $content
              Set-Content -Path $winCompatPath -Value $content -Encoding UTF8
              Write-Host "Successfully prepended Windows headers and ssize_t to win_compat.h"
          }

          # Create robust pthread.h Win32 wrapper stub
          $pthreadStubPath = "runtime/compat/win/pthread.h"
          $pthreadStubContent = @"
          #pragma once
          #include <windows.h>
          #include <process.h>

          typedef HANDLE pthread_t;

          typedef struct {
              size_t stack_size;
          } pthread_attr_t;

          inline int pthread_attr_init(pthread_attr_t* attr) {
              if (!attr) return -1;
              attr->stack_size = 0;
              return 0;
          }

          inline int pthread_attr_destroy(pthread_attr_t* attr) {
              return 0;
          }

          inline int pthread_attr_setstacksize(pthread_attr_t* attr, size_t stack_size) {
              if (!attr) return -1;
              attr->stack_size = stack_size;
              return 0;
          }

          inline int pthread_create(pthread_t* thread, const pthread_attr_t* attr, void* (*start_routine) (void*), void* arg) {
              if (!thread) return -1;
              SIZE_T stackSize = (attr && attr->stack_size > 0) ? attr->stack_size : 0;
              
              struct Param {
                  void* (*func)(void*);
                  void* arg;
              };
              Param* p = new Param{start_routine, arg};

              auto winThreadFunc = [](LPVOID lpParam) -> DWORD {
                  Param* p = static_cast<Param*>(lpParam);
                  auto func = p->func;
                  void* arg = p->arg;
                  delete p;
                  func(arg);
                  return 0;
              };

              HANDLE hThread = CreateThread(NULL, stackSize, winThreadFunc, p, 0, NULL);
              if (hThread == NULL) {
                  delete p;
                  return -1;
              }

              *thread = hThread;
              return 0;
          }

          inline int pthread_join(pthread_t thread, void** retval) {
              if (WaitForSingleObject(thread, INFINITE) != WAIT_OBJECT_0) {
                  return -1;
              }
              CloseHandle(thread);
              if (retval) *retval = nullptr;
              return 0;
          }

          inline int pthread_detach(pthread_t thread) {
              CloseHandle(thread);
              return 0;
          }
          "@
          Set-Content -Path $pthreadStubPath -Value $pthreadStubContent -Encoding UTF8
          Write-Host "Successfully created pthread.h compatibility stub."

          # Create robust unistd.h Windows compatibility stub (with direct.h and file descriptors)
          $unistdStubPath = "runtime/compat/win/unistd.h"
          $unistdStubContent = @"
          #pragma once
          // Include Winsock before Windows headers to avoid winsock.h conflicts.
          #include <winsock2.h>
          #include <windows.h>
          #include <io.h>
          #include <process.h>
          #include <direct.h>
          #include <stdint.h>
          #include <stdio.h>

          #ifndef _SSIZE_T_DEFINED
          #define _SSIZE_T_DEFINED
          typedef intptr_t ssize_t;
          #endif

          #ifndef _USECONDS_T_DEFINED
          #define _USECONDS_T_DEFINED
          typedef unsigned int useconds_t;
          #endif

          #ifndef STDIN_FILENO
          #define STDIN_FILENO 0
          #endif
          #ifndef STDOUT_FILENO
          #define STDOUT_FILENO 1
          #endif
          #ifndef STDERR_FILENO
          #define STDERR_FILENO 2
          #endif

          #define F_OK 0
          #define W_OK 2
          #define R_OK 4
          #define X_OK 0

          // POSIX names used by the project, mapped to the Windows CRT.
          inline int isatty(int fd) { return _isatty(fd); }
          inline int access(const char* path, int mode) { return _access(path, mode); }
          inline int unlink(const char* path) { return _unlink(path); }
          inline int rmdir(const char* path) { return _rmdir(path); }
          inline int ftruncate(int fd, int64_t length) { return _chsize_s(fd, length); }
          inline unsigned int sleep(unsigned int seconds) { Sleep(seconds * 1000); return 0; }
          inline int usleep(useconds_t usec) { Sleep((DWORD)((usec + 999) / 1000)); return 0; }
          inline int getpid() { return _getpid(); }
          "@
          Set-Content -Path $unistdStubPath -Value $unistdStubContent -Encoding UTF8
          Write-Host "Successfully created unistd.h compatibility stub."

          # Add the missing POSIX file-lock header using Win32 file locking.
          New-Item -ItemType Directory -Force -Path "runtime/compat/win/sys" | Out-Null
          $fileLockHeader = @"
          #pragma once
          #include <windows.h>
          #include <io.h>
          #include <errno.h>
          #define LOCK_SH 1
          #define LOCK_EX 2
          #define LOCK_NB 4
          #define LOCK_UN 8
          inline int flock(int fd, int operation) {
              intptr_t raw = _get_osfhandle(fd);
              if (raw == -1) { errno = EBADF; return -1; }
              HANDLE h = reinterpret_cast<HANDLE>(raw);
              OVERLAPPED ov = {};
              if (operation & LOCK_UN) {
                  if (UnlockFileEx(h, 0, 1, 0, &ov)) return 0;
                  errno = EINVAL; return -1;
              }
              DWORD flags = (operation & LOCK_EX) ? LOCKFILE_EXCLUSIVE_LOCK : 0;
              if (operation & LOCK_NB) flags |= LOCKFILE_FAIL_IMMEDIATELY;
              if (LockFileEx(h, flags, 0, 1, 0, &ov)) return 0;
              DWORD e = GetLastError();
              errno = (e == ERROR_LOCK_VIOLATION) ? EWOULDBLOCK : EINVAL;
              return -1;
          }
          "@
          Set-Content -Path "runtime/compat/win/sys/file.h" -Value $fileLockHeader -Encoding UTF8

          # Windows disk-space query for installer/statvfs use.
          $statvfsHeader = @"
          #pragma once
          #include <windows.h>
          #include <stdint.h>
          struct statvfs { uint64_t f_bavail; uint64_t f_frsize; };
          inline int statvfs(const wchar_t* path, struct statvfs* out) {
              ULARGE_INTEGER available = {};
              ULARGE_INTEGER total = {};
              ULARGE_INTEGER freeBytes = {};
              if (!GetDiskFreeSpaceExW(path, &available, &total, &freeBytes)) return -1;
              out->f_bavail = available.QuadPart;
              out->f_frsize = 1;
              return 0;
          }
          "@
          Set-Content -Path "runtime/compat/win/sys/statvfs.h" -Value $statvfsHeader -Encoding UTF8

          # Windows SDK defines these names as macros; rename the local HID constants.
          $inputPath = "runtime/hid/input.cpp"
          $inputContent = Get-Content $inputPath -Raw
          $inputContent = $inputContent.Replace("ERROR_SUCCESS", "HID_ERROR_SUCCESS")
          $inputContent = $inputContent.Replace("ERROR_DEVICE_NOT_CONNECTED", "HID_ERROR_DEVICE_NOT_CONNECTED")
          Set-Content -Path $inputPath -Value $inputContent -Encoding UTF8

          # off_t is 32-bit in the Windows CRT; Windows file APIs provide 64-bit offsets.
          $discPath = "runtime/install/disc_source.cpp"
          $discContent = Get-Content $discPath -Raw
          $discContent = $discContent -replace '(?m)^(\s*)static_assert\(sizeof\(off_t\) == 8, "large file offsets are required"\);', '#ifndef _WIN32' + "`r`n" + '$1static_assert(sizeof(off_t) == 8, "large file offsets are required");' + "`r`n" + '#endif'
          Set-Content -Path $discPath -Value $discContent -Encoding UTF8

          # CPU-time clock ID is not defined by the Windows SDK. Use the available monotonic clock ID.
          $rendererPath = "runtime/gpu/renderer.cpp"
          $rendererContent = Get-Content $rendererPath -Raw
          if ($rendererContent -notmatch 'CLOCK_THREAD_CPUTIME_ID') { throw "Expected clock call not found in renderer.cpp" }
          $rendererContent = $rendererContent.Replace('CLOCK_THREAD_CPUTIME_ID', 'CLOCK_MONOTONIC')
          Set-Content -Path $rendererPath -Value $rendererContent -Encoding UTF8
          Write-Host "Applied Windows portability patches for installer locking, statvfs, HID macro names, off_t assertion, and renderer clock."

      # 8. Configure Main Project CMake using Ninja + Clang
      - name: Configure Main CMake Project
        shell: powershell
        run: |
          $vcpkgInstalled = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          
          $llvmPath = "C:\Program Files\LLVM\bin"
          if (!(Test-Path $llvmPath)) {
              $llvmPath = "C:\Program Files (x86)\LLVM\bin"
          }
          echo "$llvmPath" >> $env:GITHUB_PATH
          
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DFFMPEG_DIR="$vcpkgInstalled" `
            -DFFMPEG_INCLUDE_DIR="$vcpkgInstalled/include" `
            -DAVCODEC_LIBRARY="$vcpkgInstalled/lib/avcodec.lib" `
            -DAVFORMAT_LIBRARY="$vcpkgInstalled/lib/avformat.lib" `
            -DAVUTIL_LIBRARY="$vcpkgInstalled/lib/avutil.lib" `
            -DSWSCALE_LIBRARY="$vcpkgInstalled/lib/swscale.lib" `
            -DSWRESAMPLE_LIBRARY="$vcpkgInstalled/lib/swresample.lib"

      # 9. Build Main Project with Ninja (Picks up incremental progress and finishes compilation)
      - name: Build Main Project with Ninja
        shell: powershell
        run: cmake --build build --parallel --verbose

      # 10. Save Fresh Build Cache
      - name: Save CMake Build Cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: build
          key: cmake-build-cache-${{ runner.os }}-${{ github.sha }}

      # 11. Package Artifacts & Required Runtime DLLs
      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output
          Get-ChildItem -Recurse -Filter "*.exe" build | Copy-Item -Destination output
          Get-ChildItem -Recurse -Filter "*.dll" build | Copy-Item -Destination output -ErrorAction SilentlyContinue
          
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
              Get-ChildItem -Filter "*.dll" $vcpkgBin | Copy-Item -Destination output -ErrorAction SilentlyContinue
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
