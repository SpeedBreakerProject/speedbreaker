name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      # 1. Setup MSVC & Ninja Toolchain early (needed for both XenonRecomp and main project)
      - name: Setup MSVC & Ninja Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Remove Conflicting Unix Link Command
        shell: bash
        run: |
          rm -f /usr/bin/link

      - name: Install Ninja
        run: choco install ninja -y

      # 2. Clone and Build XenonRecomp using CMake & Ninja
      - name: Build XenonRecomp Tool
        shell: bash
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git temp-xenonrecomp
          cmake -B temp-xenonrecomp/build -S temp-xenonrecomp -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build temp-xenonrecomp/build --config Release

      # 3. Securely acquire your game binary (default.xex)
      # NOTE: If you store your default.xex in a private repository release or GitHub Secret URL, 
      # download it here so XenonRecomp can process it.
      - name: Download Game Binary
        shell: powershell
        run: |
          Write-Host "Insert command here to fetch your game binary (default.xex) if required for generation."
          # Example: Invoke-WebRequest -Uri "${{ secrets.GAME_BINARY_URL }}" -OutFile "default.xex"

      # 4. Run XenonRecomp to generate source files into ppc/
      - name: Run XenonRecomp
        shell: bash
        run: |
          # Point the built XenonRecomp binary to your game executable and output directory
          # ./temp-xenonrecomp/build/<path-to-executable>/XenonRecomp ...
          echo "Running XenonRecomp..."

      # 5. Setup SCCache for compiler caching across runs
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          version: v0.8.1

      - name: Configure Environment for SCCache
        shell: bash
        run: |
          echo "CC=sccache cl" >> $GITHUB_ENV
          echo "CXX=sccache cl" >> $GITHUB_ENV

      # 6. Configure Main Project CMake using Ninja generator
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # 7. Build Main Project rapidly using all cores
      - name: Build with Ninja
        shell: bash
        run: |
          cmake --build build --config Release

      # 8. Package Artifacts
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p output
          find build -name "*.exe" -exec cp {} output/ \;
          find build -name "*.dll" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
