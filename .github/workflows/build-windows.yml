name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - name: Install Ninja
        shell: powershell
        run: choco install ninja -y

      # 1. Clone XenonRecomp directly into tools/XenonRecomp and build with Ninja + clang-cl
      - name: Build XenonRecomp with Clang & Ninja
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "tools"
          if (!(Test-Path "tools/XenonRecomp")) {
              git clone --recursive https://github.com/hedge-dev/XenonRecomp.git tools/XenonRecomp
          }
          
          $llvmPath = "C:\Program Files\LLVM\bin"
          if (!(Test-Path $llvmPath)) {
              $llvmPath = "C:\Program Files (x86)\LLVM\bin"
          }
          echo "$llvmPath" >> $env:GITHUB_PATH
          
          cmake -B tools/XenonRecomp/build -S tools/XenonRecomp -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build tools/XenonRecomp/build --config Release

      # 2. Download default.xex into game/files/ where config/nfsmw.toml expects it
      - name: Download Game Binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "game/files"
          curl.exe -L -o "game/files/default.xex" "https://github.com/rafidwayne/speedbreaker-private/releases/download/xex/default.xex"
          Write-Host "Successfully downloaded default.xex into game/files/."

      # 3. Run XenonRecomp from tools/XenonRecomp
      - name: Generate PPC Sources via XenonRecomp
        shell: powershell
        run: |
          $recompExe = (Get-ChildItem -Recurse -Filter "XenonRecomp.exe" -Path tools/XenonRecomp).FullName
          $contextHeader = (Get-ChildItem -Recurse -Filter "ppc_context.h" -Path tools/XenonRecomp).FullName
          
          Write-Host "Found XenonRecomp at: $recompExe"
          Write-Host "Found PPC Context Header at: $contextHeader"
          
          New-Item -ItemType Directory -Force -Path ppc
          
          & $recompExe config/nfsmw.toml "$contextHeader"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "XenonRecomp failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          
          Write-Host "Contents of ppc directory after generation:"
          Get-ChildItem ppc

      # 4. Restore vcpkg Cache
      - name: Restore vcpkg Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-windows-cache-v4

      # 5. Install Dependencies via vcpkg
      - name: Install Dependencies
        shell: powershell
        run: |
          vcpkg install sdl3:x64-windows `
                        vulkan-headers:x64-windows `
                        vulkan-loader:x64-windows `
                        glslang:x64-windows `
                        spirv-tools:x64-windows `
                        spirv-headers:x64-windows `
                        zlib:x64-windows `
                        ffmpeg:x64-windows

      # 6. Save vcpkg Cache immediately
      - name: Save vcpkg Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-windows-cache-v4

      # 7. Setup Windows Compatibility Layer & Robust PThread Win32 Stub
      - name: Patch Windows Compatibility & PThread Stub
        shell: powershell
        run: |
          $winCompatPath = "runtime/compat/win/win_compat.h"
          if (Test-Path $winCompatPath) {
              $content = Get-Content $winCompatPath -Raw
              $content = $content -replace '#include <unistd.h>', "#include <io.h>`n#include <process.h>"
              $content = $content -replace '#include <pthread.h>', "// #include <pthread.h>"
              
              $prefix = @"
          #ifndef WIN_COMPAT_H_INJECTED
          #define WIN_COMPAT_H_INJECTED
          #include <winsock2.h>
          #include <windows.h>
          #include <stdint.h>
          #ifndef _SSIZE_T_DEFINED
          #define _SSIZE_T_DEFINED
          typedef intptr_t ssize_t;
          #endif
          #endif

          "@
              $content = $prefix + $content
              Set-Content -Path $winCompatPath -Value $content -Encoding UTF8
              Write-Host "Successfully prepended Windows headers and ssize_t to win_compat.h"
          }

          # Create a full robust pthread.h Win32 wrapper stub
          $pthreadStubPath = "runtime/compat/win/pthread.h"
          $pthreadStubContent = @"
          #pragma once
          #include <windows.h>
          #include <process.h>

          typedef HANDLE pthread_t;

          typedef struct {
              size_t stack_size;
          } pthread_attr_t;

          inline int pthread_attr_init(pthread_attr_t* attr) {
              if (!attr) return -1;
              attr->stack_size = 0;
              return 0;
          }

          inline int pthread_attr_destroy(pthread_attr_t* attr) {
              return 0;
          }

          inline int pthread_attr_setstacksize(pthread_attr_t* attr, size_t stack_size) {
              if (!attr) return -1;
              attr->stack_size = stack_size;
              return 0;
          }

          inline int pthread_create(pthread_t* thread, const pthread_attr_t* attr, void* (*start_routine) (void*), void* arg) {
              if (!thread) return -1;
              SIZE_T stackSize = (attr && attr->stack_size > 0) ? attr->stack_size : 0;
              
              struct Param {
                  void* (*func)(void*);
                  void* arg;
              };
              Param* p = new Param{start_routine, arg};

              auto winThreadFunc = [](LPVOID lpParam) -> DWORD {
                  Param* p = static_cast<Param*>(lpParam);
                  auto func = p->func;
                  void* arg = p->arg;
                  delete p;
                  func(arg);
                  return 0;
              };

              HANDLE hThread = CreateThread(NULL, stackSize, winThreadFunc, p, 0, NULL);
              if (hThread == NULL) {
                  delete p;
                  return -1;
              }

              *thread = hThread;
              return 0;
          }

          inline int pthread_join(pthread_t thread, void** retval) {
              if (WaitForSingleObject(thread, INFINITE) != WAIT_OBJECT_0) {
                  return -1;
              }
              CloseHandle(thread);
              if (retval) *retval = nullptr;
              return 0;
          }

          inline int pthread_detach(pthread_t thread) {
              CloseHandle(thread);
              return 0;
          }
          "@
          Set-Content -Path $pthreadStubPath -Value $pthreadStubContent -Encoding UTF8
          Write-Host "Successfully created robust pthread.h compatibility stub."

      # 8. Configure Main Project CMake using Ninja + Clang
      - name: Configure Main CMake Project
        shell: powershell
        run: |
          $vcpkgInstalled = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          
          $llvmPath = "C:\Program Files\LLVM\bin"
          if (!(Test-Path $llvmPath)) {
              $llvmPath = "C:\Program Files (x86)\LLVM\bin"
          }
          echo "$llvmPath" >> $env:GITHUB_PATH
          
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DFFMPEG_DIR="$vcpkgInstalled" `
            -DFFMPEG_INCLUDE_DIR="$vcpkgInstalled/include" `
            -DAVCODEC_LIBRARY="$vcpkgInstalled/lib/avcodec.lib" `
            -DAVFORMAT_LIBRARY="$vcpkgInstalled/lib/avformat.lib" `
            -DAVUTIL_LIBRARY="$vcpkgInstalled/lib/avutil.lib" `
            -DSWSCALE_LIBRARY="$vcpkgInstalled/lib/swscale.lib" `
            -DSWRESAMPLE_LIBRARY="$vcpkgInstalled/lib/swresample.lib"

      # 9. Build Main Project with Ninja (Picks up incremental progress and finishes compilation)
      - name: Build Main Project with Ninja
        shell: powershell
        run: cmake --build build --parallel

      # 10. Save Fresh Build Cache
      - name: Save CMake Build Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: build
          key: cmake-build-cache-${{ runner.os }}-${{ github.sha }}

      # 11. Package Artifacts & Required Runtime DLLs
      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path output
          Get-ChildItem -Recurse -Filter "*.exe" build | Copy-Item -Destination output
          Get-ChildItem -Recurse -Filter "*.dll" build | Copy-Item -Destination output -ErrorAction SilentlyContinue
          
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
              Get-ChildItem -Filter "*.dll" $vcpkgBin | Copy-Item -Destination output -ErrorAction SilentlyContinue
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
