name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      # 1. Setup MSVC Toolchain environment variables
      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Remove Conflicting Unix Link Command
        shell: bash
        run: |
          rm -f /usr/bin/link

      - name: Install Ninja
        run: choco install ninja -y

      # 2. Build XenonRecomp using clang-cl
      - name: Build XenonRecomp from Source with Clang
        shell: bash
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git temp-xenonrecomp
          cmake -B temp-xenonrecomp/build -S temp-xenonrecomp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_CXX_COMPILER=clang-cl
          cmake --build temp-xenonrecomp/build --config Release

      # 3. Securely acquire your game binary (default.xex)
      - name: Download Game Binary
        shell: powershell
        run: |
          Write-Host "Insert command here to fetch your game binary (default.xex) if required for generation."
          # Example: Invoke-WebRequest -Uri "${{ secrets.GAME_BINARY_URL }}" -OutFile "default.xex"

      # 4. Run XenonRecomp to generate source files into ppc/
      - name: Run XenonRecomp Generation
        shell: bash
        run: |
          # Point the built XenonRecomp binary to your game executable
          # ./temp-xenonrecomp/build/XenonRecomp/XenonRecomp.exe ...
          echo "Running XenonRecomp generation..."

      # 5. Setup sccache action
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          version: v0.8.1

      # 6. Configure Main Project CMake cleanly with sccache launcher
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # 7. Build Main Project rapidly using all cores
      - name: Build with Ninja
        shell: bash
        run: |
          cmake --build build --config Release

      # 8. Package Artifacts
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p output
          find build -name "*.exe" -exec cp {} output/ \;
          find build -name "*.dll" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
