name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  pull_request:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      # 1. Fast shallow checkout (saves tons of clone time)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # 2. Speed up Windows I/O by excluding build folder from Defender scanning
      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      # 3. Setup Ninja & MSVC Environment
      - name: Setup MSVC & Ninja Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      # 4. Setup SCCache for compiler caching across runs
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          version: v0.8.1

      - name: Configure Environment for SCCache
        shell: bash
        run: |
          echo "CC=sccache cl" >> $GITHUB_ENV
          echo "CXX=sccache cl" >> $GITHUB_ENV

      # 5. Configure CMake using Ninja generator
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # 6. Build the project rapidly using all cores
      - name: Build with Ninja
        shell: bash
        run: |
          cmake --build build --config Release

      # 7. Package Artifacts
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p output
          # Adjust paths according to where your executable outputs (e.g. build/Release or build/)
          find build -name "*.exe" -exec cp {} output/ \;
          find build -name "*.dll" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
          
