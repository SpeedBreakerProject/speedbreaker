name: Build Windows (Optimized)

on:
  push:
    branches: [ "windows", "main", "master" ]
  pull_request:
    branches: [ "windows", "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      # 1. Fast shallow checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # 2. Exclude workspace from Windows Defender to speed up file I/O
      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      # 3. Setup MSVC & Ninja Toolchain
      - name: Setup MSVC & Ninja Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. Remove conflicting Unix 'link' command so MSVC link.exe takes precedence
      - name: Remove Conflicting Unix Link Command
        shell: bash
        run: |
          rm -f /usr/bin/link

      - name: Install Ninja
        run: choco install ninja -y

      # 5. Setup SCCache for compiler caching across runs
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        with:
          version: v0.8.1

      - name: Configure Environment for SCCache
        shell: bash
        run: |
          echo "CC=sccache cl" >> $GITHUB_ENV
          echo "CXX=sccache cl" >> $GITHUB_ENV

      # 6. Configure CMake using Ninja generator
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # 7. Build the project rapidly using all cores
      - name: Build with Ninja
        shell: bash
        run: |
          cmake --build build --config Release

      # 8. Package Artifacts
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p output
          find build -name "*.exe" -exec cp {} output/ \;
          find build -name "*.dll" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedbreaker-windows-release
          path: output/
