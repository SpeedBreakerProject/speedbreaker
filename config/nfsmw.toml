# XenonRecomp config for NFS: Most Wanted (Xbox 360, USA)
# default.xex SHA-256 aebdf3c14d1e4e4ed2c130d94bc1a0e97bd6d5bf39bdfdef33c3909c9cc4ba4c
# Paths are relative to this file.

[main]
file_path = "../game/files/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "switch_tables.toml"

# Optimizations stay off until the recompilation runs correctly.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Found by survey/xexsurvey.cpp byte patterns (one hit each). The layout
# matches Sonic Unleashed's CRT exactly: restgpr = savegpr + 0x50,
# vmx_64 = vmx_14 + 0x94.
restgprlr_14_address = 0x826BDB40
savegprlr_14_address = 0x826BDAF0
restfpr_14_address = 0x826BEAFC
savefpr_14_address = 0x826BEAB0
restvmx_14_address = 0x826BE818
savevmx_14_address = 0x826BE580
restvmx_64_address = 0x826BE8AC
savevmx_64_address = 0x826BE614

# longjmp: restores r14-r31 from the jmp_buf and calls RtlUnwind.
# setjmp: hook check (lis/lwz/bnectr), then mflr/mfcr and saves into r3.
longjmp_address = 0x826BCD30
setjmp_address = 0x826BF180

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
]

# --- generated by survey/find_entry_points.py --write ---
# Secondary entry points: code addresses the game calls through pointers
# that lie inside another function. Do not edit by hand; rerun.
secondary_entries = [
    0x821E6378,  # referenced from code; leaf code
    0x826302D4,  # referenced from data; in .pdata fn 0x82630180
    0x826BC5CC,  # referenced from code; in .pdata fn 0x826BC4A0
    0x826C5278,  # referenced from data; in .pdata fn 0x826C51D0
    0x826C54CC,  # referenced from data; in .pdata fn 0x826C53D0
    0x826CB99C,  # referenced from data; in .pdata fn 0x826CB8D8
    0x826E0EC0,  # referenced from code; leaf code
]
# --- end find_entry_points ---

